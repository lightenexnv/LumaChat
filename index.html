    <script>
      (function() {
        try {
          var saved = localStorage.getItem('luma.theme') || 'oled';
          if (saved === 'midnight') saved = 'oled';
          document.documentElement.setAttribute('data-theme', saved);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', saved === 'light' ? '#FFFFFF' : (saved === 'graphite' ? '#141518' : '#000000'));
          }
        } catch (e) {}
      })();
    </script>
